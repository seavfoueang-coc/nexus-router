<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light dark">
<title>Admin · API keys</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23111111'/%3E%3Cpath d='M10 16h12M16 10v12' stroke='%23F7F6F3' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&family=Instrument+Serif&display=swap">
<style>
  :root {
    --canvas: #F7F6F3; --surface: #FFFFFF; --surface-2: #FBFBFA; --hover: #F3F2EE;
    --ink: #111111; --ink-2: #2F3437; --muted: #787774; --faint: #A5A29C;
    --line: #EAEAEA; --line-strong: #DCDAD5;
    --btn: #111111; --btn-hover: #333333; --btn-ink: #FFFFFF;
    --red-bg: #FDEBEC; --red: #9F2F2D; --blue-bg: #E1F3FE; --blue: #1F6C9F;
    --green-bg: #EDF3EC; --green: #346538; --yellow-bg: #FBF3DB; --yellow: #956400;
    --sans: "Geist", "SF Pro Display", "Helvetica Neue", "Segoe UI Variable Text", system-ui, sans-serif;
    --serif: "Instrument Serif", "Newsreader", Georgia, serif;
    --mono: "Geist Mono", "SF Mono", "JetBrains Mono", Consolas, monospace;
    --ease: cubic-bezier(0.16, 1, 0.3, 1);
    --side: 232px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --canvas: #121211; --surface: #1A1A19; --surface-2: #1E1E1C; --hover: #232321;
      --ink: #EEEDEA; --ink-2: #D6D4CF; --muted: #8F8C86; --faint: #66645F;
      --line: #2A2927; --line-strong: #353431;
      --btn: #EEEDEA; --btn-hover: #D6D4CF; --btn-ink: #121211;
      --red-bg: #3A1F1E; --red: #F2A49F; --blue-bg: #17303F; --blue: #8CC6EC;
      --green-bg: #1D2D1E; --green: #9CCB9F; --yellow-bg: #362C14; --yellow: #E6C277;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--canvas); color: var(--ink-2); font: 14px/1.55 var(--sans); -webkit-font-smoothing: antialiased; }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; border-radius: 6px; }
  .hidden { display: none !important; }
  .num { font-variant-numeric: tabular-nums; }
  .mono { font-family: var(--mono); }
  .muted { color: var(--muted); }
  .serif { font-family: var(--serif); font-weight: 400; color: var(--ink); letter-spacing: -0.02em; }
  .eyebrow { font: 500 11px/1 var(--mono); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
  svg.i { width: 16px; height: 16px; flex: none; }

  /* ---------- buttons ---------- */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 36px; padding: 0 14px; border: 1px solid var(--btn); border-radius: 6px; background: var(--btn); color: var(--btn-ink); font-weight: 500; transition: background .15s, border-color .15s, transform .1s; white-space: nowrap; }
  .btn:hover { background: var(--btn-hover); border-color: var(--btn-hover); }
  .btn:active { transform: scale(.98); }
  .btn:disabled { opacity: .5; cursor: default; transform: none; }
  .btn.ghost { background: var(--surface); color: var(--ink-2); border-color: var(--line); }
  .btn.ghost:hover { background: var(--surface-2); border-color: var(--line-strong); }
  .btn.danger { background: var(--red); border-color: var(--red); color: #fff; }
  @media (prefers-color-scheme: dark) { .btn.danger { color: #1A1A19; } }
  .btn.sm { height: 30px; padding: 0 10px; font-size: 13px; }
  .icon-btn { width: 32px; height: 32px; display: inline-grid; place-items: center; border: 1px solid transparent; border-radius: 6px; background: transparent; color: var(--muted); }
  .icon-btn:hover { background: var(--hover); color: var(--ink); }

  .pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px; border-radius: 9999px; font: 500 10.5px/1.3 var(--mono); text-transform: uppercase; letter-spacing: .06em; white-space: nowrap; }
  .pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .pill.green { background: var(--green-bg); color: var(--green); }
  .pill.red { background: var(--red-bg); color: var(--red); }
  .pill.yellow { background: var(--yellow-bg); color: var(--yellow); }
  .pill.gray { background: var(--hover); color: var(--muted); }
  .tag { display: inline-flex; align-items: center; padding: 2px 7px; border-radius: 4px; border: 1px solid var(--line); background: var(--surface-2); font: 11.5px/1.5 var(--mono); color: var(--ink-2); white-space: nowrap; }
  .tag.blue { background: var(--blue-bg); color: var(--blue); border-color: transparent; }
.tag.green { background: var(--green-bg); color: var(--green); border-color: transparent; }
.tag.red { background: var(--red-bg); color: var(--red); border-color: transparent; }
.tag.yellow { background: var(--yellow-bg); color: var(--yellow); border-color: transparent; }

  /* ---------- layout ---------- */
  .app { display: grid; grid-template-columns: var(--side) 1fr; min-height: 100vh; }
  .side { position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; padding: 20px 14px; border-right: 1px solid var(--line); background: var(--surface-2); }
  .brand { display: flex; align-items: center; gap: 10px; padding: 4px 8px 22px; color: var(--ink); font-weight: 600; letter-spacing: -0.01em; }
  .brand-mark { width: 24px; height: 24px; border-radius: 6px; background: var(--ink); display: grid; place-items: center; color: var(--canvas); }
  .brand small { display: block; font: 11px var(--mono); color: var(--muted); font-weight: 400; }
  .nav { display: flex; flex-direction: column; gap: 2px; }
  .nav a { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 6px; color: var(--ink-2); text-decoration: none; font-weight: 500; }
  .nav a:hover { background: var(--hover); }
  .nav a.active { background: var(--surface); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line); }
  .nav a .count { margin-left: auto; font: 11px var(--mono); color: var(--muted); }
  .side-foot { margin-top: auto; display: flex; flex-direction: column; gap: 2px; padding-top: 14px; border-top: 1px solid var(--line); }
  .side-foot a, .side-foot button { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 6px; color: var(--muted); text-decoration: none; background: none; border: 0; text-align: left; font-size: 13px; }
  .side-foot a:hover, .side-foot button:hover { background: var(--hover); color: var(--ink); }

  .main { min-width: 0; padding: 28px 36px 60px; }
  .page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 22px; }
  .page-head h1 { margin: 6px 0 0; font-size: 38px; line-height: 1.05; }
  .page-head p { margin: 6px 0 0; color: var(--muted); }
  .head-actions { display: flex; gap: 8px; align-items: center; }

  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
  .card-pad { padding: 20px 22px; }
  .card-title { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
  .card-title h3 { margin: 0; font-size: 14px; font-weight: 600; color: var(--ink); }

  .grid { display: grid; gap: 12px; }
  .g-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .g-5 { grid-template-columns: repeat(5, minmax(0, 1fr)); }
  a.card.stat:hover { border-color: var(--line-strong); }
  .g-3 { grid-template-columns: 2fr 1fr; }
  .g-2 { grid-template-columns: 1fr 1fr; }
  @media (max-width: 1180px) { .g-4, .g-5 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .g-5 .span-all { grid-column: 1 / -1; } .g-3, .g-2 { grid-template-columns: 1fr; } }

  .stat .v { font-size: 40px; line-height: 1; margin: 14px 0 6px; }
  .stat .v small { font-size: .45em; color: var(--muted); margin-left: 3px; }
  .stat .split { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12.5px; color: var(--muted); }
  .stat .split b { font: 500 12.5px var(--mono); color: var(--ink-2); }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 6px; vertical-align: 0; }
  .dot.in { background: var(--blue); } .dot.out { background: var(--green); }

  /* ---------- chart ---------- */
  .chart { width: 100%; height: 220px; display: block; }
  .chart .bar-in { fill: var(--blue); opacity: .85; }
  .chart .bar-out { fill: var(--green); opacity: .85; }
  .chart .grid-line { stroke: var(--line); stroke-width: 1; }
  .chart text { fill: var(--faint); font: 10.5px var(--mono); }
  .chart .hit { fill: transparent; }
  .chart .hit:hover { fill: var(--hover); }
  .chart-wrap { position: relative; }
  .tooltip { position: absolute; pointer-events: none; z-index: 5; padding: 8px 10px; border-radius: 8px; background: var(--ink); color: var(--canvas); font-size: 12px; line-height: 1.5; white-space: nowrap; transform: translateX(-50%); box-shadow: 0 4px 16px rgba(0,0,0,.12); }
  .tooltip b { font-weight: 600; }
  .legend { display: flex; gap: 16px; font-size: 12.5px; color: var(--muted); }

  /* ---------- tables ---------- */
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; font: 500 11px/1 var(--mono); text-transform: uppercase; letter-spacing: .06em; color: var(--muted); padding: 12px 14px; border-bottom: 1px solid var(--line); white-space: nowrap; background: var(--surface); position: sticky; top: 0; }
  td { padding: 12px 14px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  tr:last-child td { border-bottom: 0; }
  tbody tr.click { cursor: pointer; }
  tbody tr.click:hover td { background: var(--surface-2); }
  td.r, th.r { text-align: right; }
  .kname { font-weight: 600; color: var(--ink); }
  .ksub { font: 11.5px var(--mono); color: var(--faint); }
  .meter { width: 150px; height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; display: flex; }
  .meter i { display: block; height: 100%; }
  .meter .in { background: var(--blue); } .meter .out { background: var(--green); } .meter .over { background: var(--red); }
  .meter-cap { font: 11.5px var(--mono); color: var(--muted); margin-top: 5px; }
  .empty { padding: 40px 20px; text-align: center; color: var(--muted); }
  .empty .serif { font-size: 26px; display: block; margin-bottom: 6px; }

  .list-row { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .list-row:last-child { border-bottom: 0; }
  .list-row .grow { flex: 1; min-width: 0; }
  .list-row .name { font-weight: 500; color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .list-row a { color: inherit; text-decoration: none; }
  .hbar { height: 4px; border-radius: 2px; background: var(--line); margin-top: 6px; overflow: hidden; }
  .hbar i { display: block; height: 100%; background: var(--ink-2); opacity: .7; }

  /* ---------- toolbar ---------- */
  .toolbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
  .search { display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 12px; min-width: 240px; flex: 0 1 320px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); color: var(--muted); }
  .search input { border: 0; outline: 0; background: transparent; flex: 1; min-width: 0; color: var(--ink); }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { height: 30px; padding: 0 11px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); color: var(--ink-2); font-size: 13px; display: inline-flex; align-items: center; gap: 6px; }
  .chip:hover { border-color: var(--line-strong); }
  .chip.on { background: var(--ink); color: var(--canvas); border-color: var(--ink); }
  .chip .n { font: 11px var(--mono); opacity: .7; }

  /* ---------- drawer & modal ---------- */
  .scrim { position: fixed; inset: 0; background: rgba(17,17,17,.28); z-index: 40; opacity: 0; animation: fade .2s ease forwards; }
  @keyframes fade { to { opacity: 1; } }
  .drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(720px, 100vw); z-index: 41; background: var(--canvas); border-left: 1px solid var(--line); overflow-y: auto; transform: translateX(24px); opacity: 0; animation: slide .35s var(--ease) forwards; }
  @keyframes slide { to { transform: none; opacity: 1; } }
  .drawer-head { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 24px; background: color-mix(in srgb, var(--canvas) 92%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
  .drawer-body { padding: 22px 24px 40px; display: flex; flex-direction: column; gap: 12px; }
  .modal { position: fixed; left: 50%; top: 50%; z-index: 51; width: min(640px, calc(100vw - 32px)); max-height: calc(100vh - 48px); overflow-y: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 20px 60px rgba(0,0,0,.12); transform: translate(-50%, -48%); opacity: 0; animation: pop .3s var(--ease) forwards; }
  .modal.narrow { width: min(460px, calc(100vw - 32px)); }
  @keyframes pop { to { transform: translate(-50%, -50%); opacity: 1; } }
  .scrim.top { z-index: 50; }
  .modal-head { padding: 20px 24px 0; }
  .modal-head h2 { margin: 0; font-size: 28px; line-height: 1.1; }
  .modal-head p { margin: 6px 0 0; color: var(--muted); }
  .modal-body { padding: 20px 24px; display: flex; flex-direction: column; gap: 20px; }
  .modal-foot { position: sticky; bottom: 0; display: flex; justify-content: flex-end; gap: 8px; padding: 14px 24px; border-top: 1px solid var(--line); background: var(--surface); }
  .modal-foot .left { margin-right: auto; color: var(--red); font-size: 13px; align-self: center; }

  /* ---------- forms ---------- */
  .field label, .field .label { display: block; font-size: 13px; font-weight: 500; color: var(--ink); margin-bottom: 8px; }
  .field .hint, .hint { font-size: 12.5px; color: var(--muted); margin-top: 7px; }
  .input { width: 100%; height: 40px; padding: 0 12px; border: 1px solid var(--line-strong); border-radius: 6px; background: var(--surface-2); color: var(--ink); outline: none; transition: border-color .15s, box-shadow .15s; }
  .input:focus { border-color: var(--ink); box-shadow: 0 0 0 3px rgba(17,17,17,.06); }
  .input.mono { font-family: var(--mono); }
  .input-row { display: flex; gap: 8px; align-items: center; }
  .seg { display: inline-flex; padding: 3px; gap: 2px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface-2); flex-wrap: wrap; }
  .seg button { height: 32px; padding: 0 13px; border: 0; border-radius: 6px; background: transparent; color: var(--muted); font-weight: 500; font-size: 13px; }
  .seg button:hover { color: var(--ink); }
  .seg button.on { background: var(--surface); color: var(--ink); box-shadow: 0 0 0 1px var(--line), 0 1px 2px rgba(0,0,0,.04); }
  .presets { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  .presets button { height: 26px; padding: 0 9px; border-radius: 5px; border: 1px solid var(--line); background: var(--surface); font: 12px var(--mono); color: var(--ink-2); }
  .presets button:hover { border-color: var(--line-strong); }
  .model-picker { border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .model-picker .mp-head { display: flex; gap: 8px; align-items: center; padding: 8px; border-bottom: 1px solid var(--line); background: var(--surface-2); }
  .model-picker .mp-head input { flex: 1; height: 32px; border: 1px solid var(--line); border-radius: 6px; padding: 0 10px; background: var(--surface); outline: none; min-width: 0; }
  .model-picker .mp-list { max-height: 260px; overflow-y: auto; }
  .mp-group { padding: 8px 12px 4px; display: flex; justify-content: space-between; align-items: center; font: 500 11px var(--mono); text-transform: uppercase; letter-spacing: .06em; color: var(--muted); background: var(--surface); position: sticky; top: 0; }
  .mp-group button { border: 0; background: none; color: var(--blue); font: 12px var(--sans); text-transform: none; letter-spacing: 0; padding: 0; }
  .mp-item { display: flex; align-items: center; gap: 10px; padding: 6px 12px; cursor: pointer; font: 12.5px var(--mono); color: var(--ink-2); }
  .mp-item:hover { background: var(--surface-2); }
  .mp-item input { accent-color: var(--ink); }
  .mp-foot { display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; border-top: 1px solid var(--line); font-size: 12.5px; color: var(--muted); background: var(--surface-2); }
  .mp-foot button { border: 0; background: none; color: var(--blue); font-size: 12.5px; padding: 0; }
  .selected-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .selected-tags .tag { gap: 6px; }
  .selected-tags .tag button { border: 0; background: none; padding: 0; color: var(--muted); line-height: 1; }

  .secret-box { display: flex; align-items: center; gap: 10px; padding: 8px 8px 8px 14px; border-radius: 8px; background: var(--surface-2); border: 1px solid var(--line-strong); }
  .secret-box code { flex: 1; min-width: 0; font: 14px var(--mono); color: var(--ink); overflow-wrap: anywhere; }
  .callout { display: flex; gap: 10px; padding: 12px 14px; border-radius: 8px; font-size: 13px; }
  .callout.yellow { background: var(--yellow-bg); color: var(--yellow); }
  .callout.red { background: var(--red-bg); color: var(--red); }
  .callout.blue { background: var(--blue-bg); color: var(--blue); }
  .kv { display: grid; grid-template-columns: 140px 1fr; gap: 10px 16px; font-size: 13.5px; }
  .kv dt { color: var(--muted); }
  .kv dd { margin: 0; color: var(--ink-2); min-width: 0; overflow-wrap: anywhere; }

  .balance-big { font-size: 64px; line-height: 1; }
  .balance-big small { font-size: .38em; color: var(--muted); margin-left: 4px; }
  .bigbar { height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; display: flex; margin: 18px 0 10px; }
  .bigbar i { display: block; height: 100%; }
  .bigbar .in { background: var(--blue); } .bigbar .out { background: var(--green); } .bigbar .over { background: var(--red); }

  .switch { position: relative; width: 34px; height: 20px; flex: none; }
  .switch input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; }
  .switch span { position: absolute; inset: 0; border-radius: 10px; background: var(--line-strong); transition: background .15s; pointer-events: none; }
  .switch span::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.2); transition: transform .2s var(--ease); }
  .switch input:checked + span { background: var(--green); }
  .switch input:checked + span::after { transform: translateX(14px); }
  .switch input:disabled + span { opacity: .5; }

  /* ---------- menu, toast ---------- */
  .menu { position: fixed; z-index: 60; min-width: 180px; padding: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 10px 30px rgba(0,0,0,.10); }
  .menu button { width: 100%; display: flex; align-items: center; gap: 10px; padding: 8px 10px; border: 0; border-radius: 5px; background: none; text-align: left; font-size: 13px; color: var(--ink-2); }
  .menu button:hover { background: var(--hover); }
  .menu button.danger { color: var(--red); }
  .menu hr { border: 0; border-top: 1px solid var(--line); margin: 4px 0; }
  .toasts { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 70; display: flex; flex-direction: column; gap: 8px; align-items: center; }
  .toast { padding: 10px 14px; border-radius: 8px; background: var(--ink); color: var(--canvas); font-size: 13px; box-shadow: 0 8px 24px rgba(0,0,0,.14); animation: pop2 .3s var(--ease); }
  .toast.err { background: var(--red); color: #fff; }
  @keyframes pop2 { from { transform: translateY(8px); opacity: 0; } }

  /* ---------- sign in ---------- */
  .signin { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
  .signin .box { width: min(420px, 100%); }
  .signin h1 { font-size: 46px; line-height: 1.05; margin: 14px 0 10px; }
  .signin p { color: var(--muted); margin: 0 0 26px; }
  .signin .card { padding: 24px; display: flex; flex-direction: column; gap: 16px; }
  .err { color: var(--red); font-size: 13px; background: var(--red-bg); padding: 9px 12px; border-radius: 6px; }

  .skel { height: 14px; border-radius: 4px; background: linear-gradient(90deg, var(--line), var(--surface-2), var(--line)); background-size: 200% 100%; animation: shimmer 1.3s linear infinite; }
  @keyframes shimmer { to { background-position: -200% 0; } }
  .spin { animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .reveal { opacity: 0; transform: translateY(10px); animation: rise .5s var(--ease) forwards; animation-delay: calc(var(--i, 0) * 60ms); }
  @keyframes rise { to { opacity: 1; transform: none; } }

  @media (max-width: 860px) {
    .app { grid-template-columns: 1fr; }
    .side { position: static; height: auto; flex-direction: row; align-items: center; padding: 10px 12px; gap: 10px; overflow-x: auto; border-right: 0; border-bottom: 1px solid var(--line); }
    .brand { padding: 0 8px 0 0; }
    .brand small { display: none; }
    .nav { flex-direction: row; }
    .nav a .count { display: none; }

<script>
(() => {
"use strict";

// =============== utilities ===============
const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => [...root.querySelectorAll(sel)];
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const icon = (id, cls = "i") => `<svg class="${cls}"><use href="#i-${id}"/></svg>`;
const fmt = new Intl.NumberFormat();
function trim2(x) { return (Math.floor(x * 100) / 100).toFixed(2).replace(/\.?0+$/, ""); }
function short(n) {
  if (n == null || !isFinite(n)) return "-";
  const a = Math.abs(n);
  if (a >= 1e9) return trim2(n / 1e9) + "B";
  if (a >= 1e6) return trim2(n / 1e6) + "M";
  if (a >= 1e4) return trim2(n / 1e3) + "k";
  return fmt.format(n);
}
function splitShort(n) { const s = short(n); const m = /^(.*?)([kMB]?)$/.exec(s); return [m[1], m[2]]; }
function toDate(v) { if (v == null || v === "") return null; const d = new Date(typeof v === "string" && /^\d+$/.test(v) ? Number(v) : v); return isNaN(d) ? null : d; }
const dFmt = new Intl.DateTimeFormat(undefined, { day: "numeric", month: "short", year: "numeric" });
const dtFmt = new Intl.DateTimeFormat(undefined, { day: "numeric", month: "short", year: "numeric", hour: "2-digit", minute: "2-digit" });
const tFmt = new Intl.DateTimeFormat(undefined, { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit", second: "2-digit" });
function relative(v) {
  const d = toDate(v); if (!d) return "never";
  const diff = d.getTime() - Date.now(), a = Math.abs(diff);
  const [n, u] = a >= 864e5 ? [Math.round(a / 864e5), "day"] : a >= 36e5 ? [Math.round(a / 36e5), "hour"] : a >= 6e4 ? [Math.round(a / 6e4), "min"] : [0, ""];
  if (!u) return diff >= 0 ? "in a moment" : "just now";
  const t = n + " " + u + (n === 1 ? "" : "s");
  return diff >= 0 ? "in " + t : t + " ago";
}
function parseTokens(v) {
  const m = String(v ?? "").trim().toLowerCase().replace(/[,_\s]/g, "").match(/^(\d+(?:\.\d+)?)([kmb]?)$/);
  if (!m) return null;
  const n = Math.round(Number(m[1]) * { "": 1, k: 1e3, m: 1e6, b: 1e9 }[m[2]]);
  return n > 0 ? n : null;
}
const STATUS = {
  active: ["Active", "green"], out_of_tokens: ["Out of tokens", "red"], disabled: ["Disabled", "gray"],
  expired: ["Expired", "red"], revoked: ["Revoked", "red"], banned: ["Blocked", "red"],
};
const statusPill = (s) => { const [l, t] = STATUS[s] || [s, "yellow"]; return `<span class="pill ${t}">${esc(l)}</span>`; };
const RESET_LABEL = { once: "One-time", daily: "Daily", weekly: "Weekly", monthly: "Monthly" };

function toast(msg, isErr) {
  const el = document.createElement("div");
  el.className = "toast" + (isErr ? " err" : "");
  el.textContent = msg;
  $("#toasts").append(el);
  setTimeout(() => el.remove(), isErr ? 5200 : 2600);
}

async function api(path, { method = "GET", body } = {}) {
  const opts = { method, headers: {}, credentials: "same-origin", cache: "no-store" };
  if (method !== "GET") opts.headers["x-admin-request"] = "1";
  if (body !== undefined) { opts.headers["content-type"] = "application/json"; opts.body = JSON.stringify(body); }
  const r = await fetch(path, opts);
  const data = await r.json().catch(() => ({}));
  if (r.status === 401 && path !== "/admin/api/login") { showSignin(); throw new Error(data.error || "Sign in first."); }
  if (!r.ok) throw new Error(data.error || `Request failed (${r.status})`);
  return data;
}

async function copy(text, btn) {
  let ok = false;
  try { await navigator.clipboard.writeText(text); ok = true; } catch {
    const ta = document.createElement("textarea"); ta.value = text; document.body.append(ta); ta.select();
    try { ok = document.execCommand("copy"); } catch {} ta.remove();
  }
  if (btn) { const old = btn.innerHTML; btn.innerHTML = icon(ok ? "check" : "copy") + (ok ? "Copied" : "Copy failed"); setTimeout(() => (btn.innerHTML = old), 1500); }
  return ok;
}

// =============== state ===============
const state = { keys: null, models: null, overview: null, portalUrl: "http://127.0.0.1:20130", omniUrl: "http://127.0.0.1:20128/dashboard", keyFilter: "all", keySearch: "", modelSearch: "", modelGroup: "all" };

// =============== auth ===============
function showSignin() {
  closeLayer();
  $("#app").classList.add("hidden");
  $("#signin").classList.remove("hidden");
  setTimeout(() => $("#password").focus(), 50);
}
function showApp() {
  $("#signin").classList.add("hidden");
  $("#app").classList.remove("hidden");
  $("#portalLink").href = state.portalUrl;
  $("#omniLink").href = state.omniUrl;
  route();
  refreshProviderCount();
}
async function refreshProviderCount() {
  try { applyProviderCount(await api("/admin/api/providers")); } catch {}
}
function applyProviderCount(d) {
  const withCredit = d.providers.filter((x) => x.isActive && x.credit);
  const has = withCredit.some((x) => x.estimate);
  const left = withCredit.reduce((s, x) => s + (x.credit.remaining || 0), 0), total = withCredit.reduce((s, x) => s + (x.credit.total || 0), 0);
  setProviderCount(d.tokensAvailable, has, d.committed > d.tokensAvailable || (total && left / total <= 0.1));
}
setInterval(() => { if (!$("#app").classList.contains("hidden") && !document.hidden) refreshProviderCount(); }, 5 * 60 * 1000);
$("#loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const btn = $("#loginBtn"), err = $("#loginErr");
  err.classList.add("hidden");
  btn.disabled = true; btn.textContent = "Signing in";
  try {
    await api("/admin/api/login", { method: "POST", body: { password: $("#password").value } });
    $("#password").value = "";
    showApp();
  } catch (ex) {
    err.textContent = ex.message; err.classList.remove("hidden");
  } finally { btn.disabled = false; btn.textContent = "Sign in"; }
});
$("#logout").addEventListener("click", async () => {
  try { await api("/admin/api/logout", { method: "POST" }); } catch {}
  state.keys = state.models = state.overview = null;
  showSignin();
});

// =============== router ===============
function currentView() { const m = /^#\/(\w+)/.exec(location.hash); return m && ["overview", "keys", "models", "providers"].includes(m[1]) ? m[1] : "overview"; }
function route() {
  const view = currentView();
  $$(".nav a").forEach((a) => a.classList.toggle("active", a.dataset.view === view));
  ({ overview: renderOverview, keys: renderKeys, models: renderModels, providers: renderProviders })[view]();
}
window.addEventListener("hashchange", () => { closeLayer(); route(); });

function pageHead(eyebrow, title, sub, actions = "") {
  return `<div class="page-head reveal"><div><div class="eyebrow">${eyebrow}</div><h1 class="serif">${title}</h1>${sub ? `<p>${sub}</p>` : ""}</div><div class="head-actions">${actions}</div></div>`;
}
function loading() { return `<div class="card card-pad"><div class="skel" style="width:40%"></div><div class="skel" style="width:70%;margin-top:12px"></div><div class="skel" style="width:55%;margin-top:12px"></div></div>`; }

async function loadKeys(force) {
  if (!state.keys || force) state.keys = (await api("/admin/api/keys")).keys;
  $("#navKeys").textContent = state.keys.length;
  return state.keys;
}
async function loadModels(force) {
  if (!state.models || force) state.models = await api("/admin/api/models" + (force ? "?refresh=1" : ""));
  $("#navModels").textContent = state.models.models.filter((m) => !m.aliasOf && m.check?.status !== "broken").length || "";
  return state.models;
}

// One provider model can be listed under two names (kiro/x and kr/x). They are the same model, but OmniRoute
// checks key access by the exact name, so the dashboard always allows or removes both names together.
function modelIndex(models) {
  const byId = new Map(models.map((m) => [m.id, m]));
  const aliasesOf = {};
  models.forEach((m) => { if (m.aliasOf) (aliasesOf[m.aliasOf] ||= []).push(m.id); });
  const canon = (id) => byId.get(id)?.aliasOf || id;
  const family = (id) => { const c = canon(id); return [c, ...(aliasesOf[c] || [])]; };
  const status = (id) => byId.get(id)?.check?.status || byId.get(canon(id))?.check?.status || null;
  return { byId, aliasesOf, canon, family, status };
}
function checkTag(check) {
  if (!check) return "";
  if (check.status === "ok") return `<span class="tag green" title="Answered a test request ${esc(relative(check.at))}">works</span>`;
  if (check.status === "broken") return `<span class="tag red" title="${esc(check.message || "")}">rejected</span>`;
  return `<span class="tag yellow" title="${esc((check.code ? check.code + ": " : "") + (check.message || ""))}">failed check</span>`;
}

// =============== chart ===============
function barChart(series, { height = 220 } = {}) {
  const W = 760, H = height, padL = 44, padB = 22, padT = 10;
  const max = Math.max(1, ...series.map((d) => d.input + d.output));
  const nice = (() => { const p = Math.pow(10, Math.floor(Math.log10(max))); const s = [1, 2, 2.5, 5, 10].find((x) => x * p >= max) * p; return s; })();
  const n = series.length, gap = 3, bw = (W - padL - gap * (n - 1)) / n;
  const y = (v) => padT + (H - padT - padB) * (1 - v / nice);
  let out = `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Daily token usage">`;
  for (let i = 0; i <= 4; i++) { const v = (nice / 4) * i, yy = y(v); out += `<line class="grid-line" x1="${padL}" x2="${W}" y1="${yy}" y2="${yy}"/><text x="${padL - 8}" y="${yy + 3}" text-anchor="end">${short(v)}</text>`; }
  series.forEach((d, i) => {
    const x = padL + i * (bw + gap);
    const yIn = y(d.input), yAll = y(d.input + d.output);
    out += `<rect class="hit" data-i="${i}" x="${x - gap / 2}" y="${padT}" width="${bw + gap}" height="${H - padT - padB}"/>`;
    if (d.input > 0) out += `<rect class="bar-in" x="${x}" y="${yIn}" width="${bw}" height="${Math.max(0, y(0) - yIn)}" rx="1.5" pointer-events="none"/>`;
    if (d.output > 0) out += `<rect class="bar-out" x="${x}" y="${Math.min(yAll, yIn - 1)}" width="${bw}" height="${Math.max(1.5, yIn - yAll)}" rx="1.5" pointer-events="none"/>`;
    if (i % 5 === 0 || i === n - 1) { const dd = new Date(d.day + "T12:00:00"); out += `<text x="${x + bw / 2}" y="${H - 6}" text-anchor="middle">${dd.toLocaleDateString(undefined, { day: "numeric", month: "short" })}</text>`; }
  });
  return out + "</svg>";
}
function wireChart(wrap, series) {
  const tip = document.createElement("div"); tip.className = "tooltip hidden"; wrap.append(tip);
  wrap.querySelectorAll(".hit").forEach((r) => {
    r.addEventListener("mouseenter", () => {
      const d = series[Number(r.dataset.i)], box = wrap.getBoundingClientRect(), rb = r.getBoundingClientRect();
      tip.innerHTML = `<b>${new Date(d.day + "T12:00:00").toLocaleDateString(undefined, { weekday: "short", day: "numeric", month: "short" })}</b><br>Input ${fmt.format(d.input)}<br>Output ${fmt.format(d.output)}<br>${fmt.format(d.requests)} requests`;
      const x = rb.left - box.left + rb.width / 2;
      tip.style.left = Math.min(box.width - 70, Math.max(70, x)) + "px"; tip.style.top = "6px"; tip.classList.remove("hidden");
    });
    r.addEventListener("mouseleave", () => tip.classList.add("hidden"));
  });
}

function usageMeter(limit, usage, width = 150) {
  if (!limit) return `<span class="muted">No limit</span>`;
  const pct = limit.tokenLimit > 0 ? Math.min(100, (limit.used / limit.tokenLimit) * 100) : 0;
  const shown = limit.used > 0 ? Math.max(pct, 2) : 0;
  const io = (usage?.input || 0) + (usage?.output || 0);
  const inShare = io > 0 ? usage.input / io : .5;
  const over = limit.remaining <= 0;
  return `<div class="meter" style="width:${width}px">${over ? `<i class="over" style="width:100%"></i>` : `<i class="in" style="width:${shown * inShare}%"></i><i class="out" style="width:${shown * (1 - inShare)}%"></i>`}</div>
    <div class="meter-cap num">${short(limit.used)} / ${short(limit.tokenLimit)} · ${pct >= 10 || pct === 0 ? pct.toFixed(0) : pct.toFixed(1)}%</div>`;
}

// =============== provider balance (overview card + sidebar count) ===============
const creditFmt = (n) => Number(n).toLocaleString(undefined, { maximumFractionDigits: 2 });
function setProviderCount(tokensLeft, short_ok, low) {
  const el = $("#navProviders");
  el.textContent = short_ok ? "≈" + short(tokensLeft) : "";
  el.style.color = low ? "var(--red)" : "";
  el.title = short_ok ? "Estimated tokens your providers can still supply" : "";
}
function providerCard(p) {
  if (!p) {
    setProviderCount(0, false);
    return `<a href="#/providers" class="card card-pad stat reveal span-all" style="--i:5;text-decoration:none;color:inherit"><div class="eyebrow">Provider balance</div><div class="v serif">-</div><div class="split"><span>No provider reports a balance</span></div></a>`;
  }
  const short_ok = p.hasEstimate;
  const low = p.committed > p.tokensLeft || (p.creditsTotal && p.creditsLeft / p.creditsTotal <= 0.1);
  setProviderCount(p.tokensLeft, short_ok, low);
  const [tv, tu] = short_ok ? splitShort(p.tokensLeft) : ["-", ""];
  return `<a href="#/providers" class="card card-pad stat reveal span-all" style="--i:5;text-decoration:none;color:inherit" title="Open provider balances">
    <div class="eyebrow">${p.name ? esc(p.name) + " " : ""}tokens left</div>
    <div class="v serif num">${short_ok ? "≈ " : ""}${tv}<small>${tu}</small></div>
    <div class="split"><span><b>${creditFmt(p.creditsLeft)}</b> of ${creditFmt(p.creditsTotal)} credits</span>${p.nextResetAt ? `<span>resets ${relative(p.nextResetAt)}</span>` : ""}</div>
    ${low ? `<div class="split" style="margin-top:6px;color:var(--red)"><span>${p.committed > p.tokensLeft ? "Less than your keys can use" : "Credits running low"}</span></div>` : ""}
  </a>`;
}

// =============== OVERVIEW ===============
async function renderOverview() {
  const main = $("#main");
  main.innerHTML = pageHead("Overview", "Usage at a glance", "Token use across every API key.", `<button class="btn ghost" id="ovRefresh">${icon("refresh")}Refresh</button><button class="btn" id="ovNew">${icon("plus")}New key</button>`) + loading();
  $("#ovNew").onclick = () => openKeyEditor();
  $("#ovRefresh").onclick = () => { state.overview = null; renderOverview(); };
  let o;
  try { o = state.overview = await api("/admin/api/overview"); } catch (e) { main.querySelector(".card").outerHTML = `<div class="callout red">${icon("warn")}${esc(e.message)}</div>`; return; }
  if (currentView() !== "overview") return;
  const stat = (label, t, i) => {
    const [v, u] = splitShort(t.input + t.output);
    return `<div class="card card-pad stat reveal" style="--i:${i}"><div class="eyebrow">${label}</div><div class="v serif num">${v}<small>${u}</small></div>
      <div class="split"><span><span class="dot in"></span>In <b>${short(t.input)}</b></span><span><span class="dot out"></span>Out <b>${short(t.output)}</b></span><span>${fmt.format(t.requests)} req</span></div></div>`;
  };
  const c = o.counts;
  const keysCard = `<div class="card card-pad stat reveal" style="--i:4"><div class="eyebrow">API keys</div><div class="v serif num">${c.total || 0}</div>
    <div class="split"><span><b>${c.active || 0}</b> active</span><span><b>${c.out_of_tokens || 0}</b> out</span><span><b>${(c.disabled || 0) + (c.expired || 0)}</b> off</span></div></div>`;
  const maxTop = Math.max(1, ...o.topKeys.map((k) => k.usage.input + k.usage.output));
  const maxModel = Math.max(1, ...o.topModels.map((m) => m.input + m.output));
  const attention = o.attention.length ? o.attention.map((k) => {
    let why = "";
    if (k.status === "out_of_tokens") why = "Out of tokens";
    else if (k.status === "expired") why = "Expired";
    else if (k.limit && k.limit.remaining / k.limit.tokenLimit <= .1) why = `${short(k.limit.remaining)} tokens left`;
    else if (k.expiresAt) why = "Expires " + relative(k.expiresAt);
    return `<div class="list-row"><div class="grow"><a href="#/keys" data-open="${k.id}" class="name">${esc(k.name)}</a><div class="ksub">${esc(why)}</div></div>${statusPill(k.status)}</div>`;
  }).join("") : `<div class="muted" style="padding:8px 0">Nothing needs attention.</div>`;

  main.innerHTML = pageHead("Overview", "Usage at a glance", "Token use across every API key.", `<button class="btn ghost" id="ovRefresh">${icon("refresh")}Refresh</button><button class="btn" id="ovNew">${icon("plus")}New key</button>`) + `
  <div class="grid g-5">${stat("Today", o.totals.today, 0)}${stat("Last 7 days", o.totals.last7, 1)}${stat("Last 30 days", o.totals.last30, 2)}${keysCard}${providerCard(o.providers)}</div>
  <div class="grid g-3" style="margin-top:12px">
    <div class="card card-pad reveal" style="--i:5"><div class="card-title"><h3>Daily tokens, last 30 days</h3><div class="legend"><span><span class="dot in"></span>Input</span><span><span class="dot out"></span>Output</span></div></div><div class="chart-wrap" id="ovChart">${barChart(o.daily)}</div></div>
    <div class="card card-pad reveal" style="--i:6"><div class="card-title"><h3>Needs attention</h3></div>${attention}</div>
  </div>
  <div class="grid g-2" style="margin-top:12px">
    <div class="card card-pad reveal" style="--i:7"><div class="card-title"><h3>Top keys, 30 days</h3><a class="btn sm ghost" href="#/keys">All keys</a></div>
      ${o.topKeys.length ? o.topKeys.map((k) => `<div class="list-row"><div class="grow"><a href="#/keys" data-open="${k.id}" class="name">${esc(k.name)}</a><div class="hbar"><i style="width:${((k.usage.input + k.usage.output) / maxTop) * 100}%"></i></div></div><div class="r num mono" style="font-size:12.5px">${short(k.usage.input + k.usage.output)}</div></div>`).join("") : `<div class="muted">No key has used tokens in the last 30 days.</div>`}
    </div>
    <div class="card card-pad reveal" style="--i:8"><div class="card-title"><h3>Top models, 30 days</h3><a class="btn sm ghost" href="#/models">All models</a></div>
      ${o.topModels.length ? o.topModels.map((m) => `<div class="list-row"><div class="grow"><div class="name mono" style="font-size:12.5px">${esc((m.provider ? m.provider + "/" : "") + m.model)}</div><div class="hbar"><i style="width:${((m.input + m.output) / maxModel) * 100}%"></i></div></div><div class="r num mono" style="font-size:12.5px">${short(m.input + m.output)}</div></div>`).join("") : `<div class="muted">No usage yet.</div>`}
    </div>
  </div>`;
  $("#ovNew").onclick = () => openKeyEditor();
  $("#ovRefresh").onclick = () => { state.overview = null; renderOverview(); };
  wireChart($("#ovChart"), o.daily);
  $$("[data-open]", main).forEach((a) => a.addEventListener("click", (e) => { e.preventDefault(); location.hash = "#/keys"; setTimeout(() => openKeyDrawer(a.dataset.open), 0); }));
  loadKeys().catch(() => {});
}

// =============== KEYS ===============
async function renderKeys(force) {
  const main = $("#main");
  const head = pageHead("API keys", "Keys and limits", "Create keys, set token limits, expiry and allowed models.", `<button class="btn ghost" id="kRefresh">${icon("refresh")}Refresh</button><button class="btn" id="kNew">${icon("plus")}New key</button>`);
  if (!state.keys || force) main.innerHTML = head + loading();
  try { await loadKeys(force); } catch (e) { main.innerHTML = head + `<div class="callout red">${icon("warn")}${esc(e.message)}</div>`; return; }
  if (currentView() !== "keys") return;
  const counts = { all: state.keys.length };
  state.keys.forEach((k) => { counts[k.status] = (counts[k.status] || 0) + 1; });
  const filters = [["all", "All"], ["active", "Active"], ["out_of_tokens", "Out of tokens"], ["disabled", "Disabled"], ["expired", "Expired"]];
  main.innerHTML = head + `
    <div class="toolbar reveal" style="--i:1">
      <label class="search">${icon("search")}<input id="kSearch" placeholder="Search keys" value="${esc(state.keySearch)}"></label>
      <div class="chips">${filters.filter(([id]) => id === "all" || counts[id]).map(([id, l]) => `<button class="chip ${state.keyFilter === id ? "on" : ""}" data-f="${id}">${l}<span class="n">${counts[id] || 0}</span></button>`).join("")}</div>
    </div>
    <div class="card reveal" style="--i:2"><div class="table-wrap"><table>
      <thead><tr><th>Key</th><th>Status</th><th>Usage</th><th class="r">Left</th><th>Resets</th><th>Expires</th><th>Models</th><th>Last used</th><th></th></tr></thead>
      <tbody id="kBody"></tbody></table></div></div>`;
  $("#kNew").onclick = () => openKeyEditor();
  $("#kRefresh").onclick = () => renderKeys(true);
  $("#kSearch").addEventListener("input", (e) => { state.keySearch = e.target.value; fillKeyRows(); });
  $$(".chip[data-f]").forEach((c) => c.addEventListener("click", () => { state.keyFilter = c.dataset.f; renderKeys(); }));
  fillKeyRows();
}

function fillKeyRows() {
  const q = state.keySearch.trim().toLowerCase();
  const rows = state.keys.filter((k) => (state.keyFilter === "all" || k.status === state.keyFilter) && (!q || k.name.toLowerCase().includes(q) || (k.prefix || "").toLowerCase().includes(q) || (k.models || []).some((m) => m.toLowerCase().includes(q))));
  const body = $("#kBody");
  if (!rows.length) {
    body.innerHTML = `<tr><td colspan="9"><div class="empty"><span class="serif">${state.keys.length ? "No matching keys" : "No API keys yet"}</span>${state.keys.length ? "Try another search or filter." : `Create one to share access with a token limit.<div style="margin-top:14px"><button class="btn" id="emptyNew">${icon("plus")}New key</button></div>`}</div></td></tr>`;
    const b = $("#emptyNew"); if (b) b.onclick = () => openKeyEditor();
    return;
  }
  body.innerHTML = rows.map((k) => {
    const L = k.limit;
    const resets = !L ? `<span class="muted">-</span>` : L.reset === "once" ? `<span class="tag">One-time</span>` : `<span class="tag">${RESET_LABEL[L.reset]}</span><div class="ksub">${L.nextResetAt ? relative(L.nextResetAt) : ""}</div>`;
    const exp = k.expiresAt ? `${dFmt.format(toDate(k.expiresAt))}<div class="ksub">${relative(k.expiresAt)}</div>` : `<span class="muted">Never</span>`;
    const models = k.models ? `<span class="tag" title="${esc(k.models.join("\n"))}">${k.models.length} model${k.models.length === 1 ? "" : "s"}</span>` : `<span class="tag blue">All</span>`;
    return `<tr class="click" data-id="${k.id}">
      <td><div class="kname">${esc(k.name)}</div><div class="ksub">${esc(k.prefix || "")}…</div></td>
      <td>${statusPill(k.status)}</td>
      <td>${usageMeter(L, k.limit?.reset === "once" ? k.usageAll : k.usage30d)}</td>
      <td class="r num mono">${L ? short(L.remaining) : "-"}</td>
      <td>${resets}</td>
      <td>${exp}</td>
      <td>${models}</td>
      <td class="muted">${k.lastUsedAt ? relative(k.lastUsedAt) : "Never"}</td>
      <td class="r"><button class="icon-btn" data-menu="${k.id}" aria-label="Actions for ${esc(k.name)}">${icon("dots")}</button></td></tr>`;
  }).join("");
  $$("tr.click", body).forEach((tr) => tr.addEventListener("click", (e) => { if (e.target.closest("[data-menu]")) return; openKeyDrawer(tr.dataset.id); }));
  $$("[data-menu]", body).forEach((b) => b.addEventListener("click", (e) => { e.stopPropagation(); openKeyMenu(b, state.keys.find((k) => k.id === b.dataset.menu)); }));
}

function openKeyMenu(anchor, key) {
  closeMenu();
  const menu = document.createElement("div");
  menu.className = "menu"; menu.id = "menu";
  menu.innerHTML = `<button data-a="view">${icon("key")}View usage</button><button data-a="edit">${icon("edit")}Edit limits &amp; models</button>
    <button data-a="toggle">${icon("power")}${key.isActive ? "Disable" : "Enable"}</button><hr><button data-a="delete" class="danger">${icon("trash")}Delete</button>`;
  document.body.append(menu);
  const r = anchor.getBoundingClientRect();
  menu.style.top = Math.min(window.innerHeight - menu.offsetHeight - 8, r.bottom + 4) + "px";
  menu.style.left = Math.max(8, r.right - menu.offsetWidth) + "px";
  menu.addEventListener("click", (e) => {
    const a = e.target.closest("button")?.dataset.a; if (!a) return;
    closeMenu();
    if (a === "view") openKeyDrawer(key.id);
    if (a === "edit") openKeyEditor(key.id);
    if (a === "toggle") toggleKey(key);
    if (a === "delete") confirmDelete(key);
  });
  setTimeout(() => document.addEventListener("click", closeMenu, { once: true }), 0);
}
function closeMenu() { $("#menu")?.remove(); }

async function toggleKey(key, after) {
  try {
    await api(`/admin/api/keys/${key.id}/${key.isActive ? "disable" : "enable"}`, { method: "POST" });
    toast(`"${key.name}" ${key.isActive ? "disabled" : "enabled"}.`);
    await refreshAfterChange(); after?.();
  } catch (e) { toast(e.message, true); }
}

function confirmDelete(key, after) {
  openModal(`<div class="modal narrow" role="dialog" aria-modal="true">
    <div class="modal-head"><h2 class="serif">Delete this key?</h2><p>"${esc(key.name)}" stops working right away. This cannot be undone.</p></div>
    <div class="modal-body"><div class="field"><label for="delName">Type the key name to confirm</label><input id="delName" class="input" autocomplete="off"></div></div>
    <div class="modal-foot"><button class="btn ghost" data-close>Cancel</button><button class="btn danger" id="delGo" disabled>${icon("trash")}Delete key</button></div></div>`);
  const input = $("#delName"), go = $("#delGo");
  input.focus();
  input.addEventListener("input", () => (go.disabled = input.value.trim() !== key.name));
  go.onclick = async () => {
    go.disabled = true;
    try { await api(`/admin/api/keys/${key.id}`, { method: "DELETE" }); closeLayer(); toast(`Deleted "${key.name}".`); await refreshAfterChange(); after?.(); }
    catch (e) { toast(e.message, true); go.disabled = false; }
  };
}

async function refreshAfterChange() {
  state.overview = null;
  await loadKeys(true);
  if (state.models) loadModels(true).catch(() => {});
  if (currentView() === "keys") renderKeys();
  else if (currentView() === "overview") renderOverview();
  else if (currentView() === "models") renderModels();
}

          <div style="text-align:right"><div class="eyebrow">${isOnce ? "Resets" : "Next reset"}</div><div class="mono" style="margin-top:10px;color:var(--ink)">${isOnce ? "Never" : L.nextResetAt ? dtFmt.format(toDate(L.nextResetAt)) : "-"}</div><div class="muted">${isOnce ? "Top up by raising the limit" : L.nextResetAt ? relative(L.nextResetAt) : ""}</div></div>
        </div>

        <div class="legend" style="justify-content:space-between"><span><span class="dot in"></span>Input ${short(scopeUsage.input)}</span><span><span class="dot out"></span>Output ${short(scopeUsage.output)}</span><span>${fmt.format(scopeUsage.requests)} requests ${isOnce ? "in total" : "in 30 days"}</span><span class="mono">${pct.toFixed(pct >= 10 || pct === 0 ? 0 : 1)}% used</span></div>`
