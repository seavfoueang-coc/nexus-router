// ---------- key editor ----------
async function openKeyEditor(id, { focus } = {}) {
  const editing = !!id;
  let d = null;
  if (editing) { try { d = await api(`/admin/api/keys/${id}`); } catch (e) { toast(e.message, true); return; } }
  let catalogModels = [];
  try { catalogModels = (await loadModels()).models; } catch {}
  const idx = modelIndex(catalogModels);
  // One row per real model: aliases are folded into their main name, models the provider rejects are hidden.
  const catalog = catalogModels.filter((m) => !m.aliasOf && m.check?.status !== "broken").map((m) => m.id);
  const hiddenBroken = catalogModels.filter((m) => !m.aliasOf && m.check?.status === "broken").length;

  const f = {
    name: d?.name || "",
    tokens: d?.limit ? String(d.limit.tokenLimit) : "",
    reset: d?.limit?.reset || "once",
    expMode: d?.expiresAt ? "date" : "never",
    expDays: "30",
    expDate: d?.expiresAt ? (() => { const x = toDate(d.expiresAt); return `${x.getFullYear()}-${String(x.getMonth() + 1).padStart(2, "0")}-${String(x.getDate()).padStart(2, "0")}`; })() : "",
    modelsMode: d && !d.models ? "all" : d?.models ? "some" : "some",
    models: new Set((d?.models || []).map((m) => idx.canon(m))),
  };
  if (!editing && !catalog.length) f.modelsMode = "all";
  const usedNow = d?.limit?.used ?? 0;

  openModal(`<div class="modal" role="dialog" aria-modal="true">
    <div class="modal-head"><div class="eyebrow">${editing ? "Edit key" : "New key"}</div><h2 class="serif">${editing ? esc(d.name) : "Create an API key"}</h2><p>${editing ? "Changes apply right away." : "The key is shown once after you create it."}</p></div>
    <form class="modal-body" id="kf" autocomplete="off">
      <div class="field"><label for="fName">Name</label><input id="fName" class="input" maxlength="200" placeholder="e.g. Somchai, laptop" value="${esc(f.name)}" required></div>

      <div class="field"><span class="label">Token limit <span class="muted" style="font-weight:400">· input + output</span></span>
        <div class="input-row"><input id="fTokens" class="input mono" style="max-width:220px" placeholder="${editing && !d.limit ? "No limit" : "50M"}" value="${esc(f.tokens ? (parseTokens(short(Number(f.tokens)).replace(/,/g, "")) === Number(f.tokens) ? short(Number(f.tokens)).replace(/,/g, "") : f.tokens) : "")}"><span id="fTokensExact" class="muted num mono" style="font-size:12.5px"></span></div>
        <div class="presets">${["1M", "5M", "10M", "50M", "100M", "500M", "1B"].map((p) => `<button type="button" data-p="${p}">${p}</button>`).join("")}</div>
        <div class="hint" id="fTokensHint"></div>
      </div>

      <div class="field"><span class="label">When tokens reset</span>
        <div class="seg" id="fReset">${[["once", "Never (one-time)"], ["daily", "Daily"], ["weekly", "Weekly"], ["monthly", "Monthly"]].map(([v, l]) => `<button type="button" data-v="${v}">${l}</button>`).join("")}</div>
        <div class="hint" id="fResetHint"></div>
      </div>

      <div class="field"><span class="label">Key expires</span>
        <div class="input-row" style="flex-wrap:wrap">
          <div class="seg" id="fExp">${[["never", "Never"], ["days", "After days"], ["date", "On date"]].map(([v, l]) => `<button type="button" data-v="${v}">${l}</button>`).join("")}</div>
          <input id="fExpDays" class="input mono" type="number" min="1" max="3650" style="width:110px" value="${esc(f.expDays)}">
          <input id="fExpDate" class="input mono" type="date" style="width:170px" value="${esc(f.expDate)}">
        </div>
        <div class="hint" id="fExpHint"></div>
      </div>

      <div class="field" id="fModelsField"><span class="label">Allowed models</span>
        <div class="seg" id="fModelsMode"><button type="button" data-v="all">All models</button><button type="button" data-v="some">Only selected</button></div>
        <div id="fPicker" style="margin-top:10px"></div>
      </div>
    </form>
    <div class="modal-foot"><span class="left" id="fErr"></span><button class="btn ghost" data-close type="button">Cancel</button><button class="btn" id="fSave" type="button">${editing ? "Save changes" : `${icon("plus")}Create key`}</button></div>
  </div>`);

  const seg = (el, val) => $$("button", el).forEach((b) => b.classList.toggle("on", b.dataset.v === val));
  const upd = () => {
    const n = parseTokens($("#fTokens").value);
    $("#fTokensExact").textContent = n ? fmt.format(n) + " tokens" : "";
    let hint = "";
    if (editing && f.reset === "once") hint = `Used so far: <b>${short(usedNow)}</b>. This is the total for the life of the key${n && n > usedNow ? `, so ${short(n - usedNow)} would be left.` : n ? ". Set it above what is used to keep the key working." : "."}`;
    else if (editing && d?.limit) hint = `Used this period: <b>${short(usedNow)}</b>.`;
    else if (editing && !d?.limit) hint = "This key has no token limit. Leave it empty to keep it unlimited.";
    $("#fTokensHint").innerHTML = hint;
    seg($("#fReset"), f.reset);
    $("#fResetHint").textContent = f.reset === "once" ? "A fixed balance. When it is used up, the key stops working until you raise the limit." : f.reset === "daily" ? "The count starts over every day at 07:00 your time (00:00 UTC)." : f.reset === "weekly" ? "The count starts over every Monday at 07:00 your time (00:00 UTC)." : "The count starts over on the 1st of each month at 07:00 your time (00:00 UTC).";
    seg($("#fExp"), f.expMode);
    $("#fExpDays").classList.toggle("hidden", f.expMode !== "days");
    $("#fExpDate").classList.toggle("hidden", f.expMode !== "date");
    const exp = expiryValue();
    $("#fExpHint").textContent = f.expMode === "never" ? "The key keeps working until you disable or delete it." : exp ? "Stops working " + dtFmt.format(new Date(exp)) + "." : "";
    seg($("#fModelsMode"), f.modelsMode);
    renderPicker();
  };
  const expiryValue = () => {
    if (f.expMode === "never") return null;
    if (f.expMode === "days") { const n = Number($("#fExpDays").value); return n > 0 ? new Date(Date.now() + n * 864e5).toISOString() : undefined; }
    const v = $("#fExpDate").value; if (!v) return undefined;
    const [y, m, dd] = v.split("-").map(Number); return new Date(y, m - 1, dd, 23, 59, 59).toISOString();
  };

  let pickerSearch = "";
  function renderPicker() {
    const box = $("#fPicker");
    if (f.modelsMode === "all") { box.innerHTML = `<div class="hint" style="margin:0">The key can use every model, including ones added later.</div>`; return; }
    const extra = [...f.models].filter((m) => !catalog.includes(m));
    const all = [...catalog, ...extra];
    const q = pickerSearch.toLowerCase();
    const visible = all.filter((m) => !q || m.toLowerCase().includes(q));
    const groups = {};
    visible.forEach((m) => { const g = m.includes("/") ? m.split("/")[0] : "other"; (groups[g] ||= []).push(m); });
    box.innerHTML = `<div class="model-picker">
      <div class="mp-head">${icon("search")}<input id="mpSearch" placeholder="Search models, or type an exact ID and press Enter" value="${esc(pickerSearch)}"></div>
      <div class="mp-list">${Object.keys(groups).length ? Object.entries(groups).map(([g, ms]) => `<div class="mp-group"><span>${esc(g)} · ${ms.length}</span><button type="button" data-g="${esc(g)}">${ms.every((m) => f.models.has(m)) ? "Clear" : "Select all"}</button></div>${ms.map((m) => `<label class="mp-item"><input type="checkbox" data-m="${esc(m)}" ${f.models.has(m) ? "checked" : ""}>${esc(m)}${idx.aliasesOf[m] ? `<span class="ksub" title="Same model under another name; allowed together">+ ${esc(idx.aliasesOf[m].join(", "))}</span>` : ""}${idx.status(m) === "broken" ? `<span class="tag red" title="The provider rejects this model ID. Remove it.">rejected</span>` : ""}</label>`).join("")}`).join("") : `<div class="mp-item muted">${catalog.length ? "No match. Press Enter to add this exact model ID." : "Could not load the model list. Type a model ID and press Enter."}</div>`}</div>
      <div class="mp-foot"><span><b style="color:var(--ink)">${f.models.size}</b> selected${hiddenBroken ? ` <span class="muted">· ${hiddenBroken} models the provider rejects are hidden</span>` : ""}</span>${f.models.size ? `<button type="button" id="mpClear">Clear all</button>` : ""}</div></div>`;
    const s = $("#mpSearch");
    s.addEventListener("input", () => { pickerSearch = s.value; const pos = s.selectionStart; renderPicker(); const n = $("#mpSearch"); n.focus(); n.setSelectionRange(pos, pos); });
    s.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); const v = s.value.trim(); if (v) { f.models.add(v); pickerSearch = ""; renderPicker(); $("#mpSearch").focus(); } } });
    $$("[data-m]", box).forEach((c) => c.addEventListener("change", () => { c.checked ? f.models.add(c.dataset.m) : f.models.delete(c.dataset.m); $(".mp-foot b", box).textContent = f.models.size; refreshGroupButtons(); }));
    $$("[data-g]", box).forEach((b) => b.addEventListener("click", () => { const ms = groups[b.dataset.g]; const allOn = ms.every((m) => f.models.has(m)); ms.forEach((m) => (allOn ? f.models.delete(m) : f.models.add(m))); renderPicker(); }));
    const clr = $("#mpClear"); if (clr) clr.onclick = () => { f.models.clear(); renderPicker(); };
    function refreshGroupButtons() { $$("[data-g]", box).forEach((b) => { b.textContent = groups[b.dataset.g].every((m) => f.models.has(m)) ? "Clear" : "Select all"; }); }
  }

  $$("#fReset button").forEach((b) => b.addEventListener("click", () => { f.reset = b.dataset.v; upd(); }));
  $$("#fExp button").forEach((b) => b.addEventListener("click", () => { f.expMode = b.dataset.v; upd(); }));
  $$("#fModelsMode button").forEach((b) => b.addEventListener("click", () => { f.modelsMode = b.dataset.v; upd(); }));
  $$(".presets button").forEach((b) => b.addEventListener("click", () => { $("#fTokens").value = b.dataset.p; upd(); }));
  ["#fTokens", "#fExpDays", "#fExpDate"].forEach((s) => $(s).addEventListener("input", upd));
  $("#kf").addEventListener("submit", (e) => { e.preventDefault(); save(); });
  $("#fSave").onclick = save;
  upd();
  setTimeout(() => (focus === "models" ? $("#fModelsField") : focus === "tokens" ? $("#fTokens") : $("#fName"))?.scrollIntoView?.({ block: "center" }) ?? 0, 50);
  setTimeout(() => (focus === "tokens" ? $("#fTokens") : focus ? null : $("#fName"))?.focus(), 60);

  async function save() {
    const err = $("#fErr"); err.textContent = "";
    const name = $("#fName").value.trim();
    const tokens = parseTokens($("#fTokens").value);
    const exp = expiryValue();
    const keepUnlimited = editing && !d.limit && !$("#fTokens").value.trim();
    if (!name) return (err.textContent = "Give the key a name.");
    if (!tokens && !keepUnlimited) return (err.textContent = "Enter a token limit, e.g. 50M.");
    if (exp === undefined) return (err.textContent = "Pick when the key expires.");
    if (exp && new Date(exp).getTime() <= Date.now()) return (err.textContent = "The expiry date must be in the future.");
    if (f.modelsMode === "some" && !f.models.size) return (err.textContent = "Pick at least one model, or allow all models.");
    const models = f.modelsMode === "all" ? null : [...new Set([...f.models].flatMap((m) => idx.family(m)))];
    const btn = $("#fSave"); btn.disabled = true;
    try {
      if (!editing) {
        const created = await api("/admin/api/keys", { method: "POST", body: { name, tokenLimit: tokens, reset: f.reset, expiresAt: exp, models } });
        closeLayer();
        showCreated(created);
        await refreshAfterChange();
      } else {
        const body = {};
        if (name !== d.name) body.name = name;
        if (!keepUnlimited) {
          if (!d.limit || tokens !== d.limit.tokenLimit) body.tokenLimit = tokens;
          if (!d.limit || f.reset !== d.limit.reset) body.reset = f.reset;
        }
        const origExp = d.expiresAt ? toDate(d.expiresAt).toISOString() : null;
        const expChanged = f.expMode === "never" ? origExp !== null : f.expMode === "days" || (exp && (!origExp || new Date(exp).toDateString() !== new Date(origExp).toDateString()));
        if (expChanged) body.expiresAt = exp;
        const origModels = d.models ? [...d.models].sort().join("\n") : null;
        const newModels = models ? [...models].sort().join("\n") : null;
        if (origModels !== newModels) body.models = models;
        if (!Object.keys(body).length) { closeLayer(); return toast("Nothing changed."); }
        const r = await api(`/admin/api/keys/${d.id}`, { method: "PATCH", body });
        closeLayer();
        toast(r.reenabled ? `Saved. "${name}" had run out and is turned back on.` : "Saved.");
        await refreshAfterChange();
        openKeyDrawer(d.id);
      }
    } catch (e) { err.textContent = e.message; btn.disabled = false; }
  }
}

function showCreated(c) {
  const base = state.portalUrl + "/v1";
  openModal(`<div class="modal" role="dialog" aria-modal="true">
    <div class="modal-head"><div class="eyebrow">Key created</div><h2 class="serif">${esc(c.name)}</h2><p>${short(c.tokenLimit)} tokens · ${c.reset === "once" ? "one-time, never resets" : RESET_LABEL[c.reset].toLowerCase() + " reset"} · ${c.expiresAt ? "expires " + dFmt.format(new Date(c.expiresAt)) : "no expiry"}</p></div>
    <div class="modal-body">
      <div class="callout yellow">${icon("warn")}<div><b>Copy this key now.</b> It will not be shown again.</div></div>
      <div class="field"><span class="label">API key</span><div class="secret-box"><code id="cSecret">${esc(c.secret)}</code><button class="btn sm ghost" id="cCopy">${icon("copy")}Copy</button></div></div>
      <div class="field"><span class="label">Send this to the user</span>
        <div class="secret-box" style="align-items:flex-start"><code id="cMsg" style="white-space:pre-wrap;font-size:12.5px">API base URL: ${esc(base)}\nAPI key: ${esc(c.secret)}\nToken limit: ${esc(short(c.tokenLimit))} (${c.reset === "once" ? "one-time" : RESET_LABEL[c.reset].toLowerCase()})\nCheck your balance: ${esc(state.portalUrl)}</code><button class="btn sm ghost" id="cCopyMsg">${icon("copy")}Copy</button></div>
        <div class="hint">These are the public addresses users connect to.</div></div>
    </div>
    <div class="modal-foot"><button class="btn" data-close>Done</button></div></div>`);
  $("#cCopy").onclick = (e) => copy(c.secret, e.currentTarget);
  $("#cCopyMsg").onclick = (e) => copy($("#cMsg").textContent, e.currentTarget);
}

// =============== MODELS ===============
async function renderModels(force) {
  const main = $("#main");
  const head = pageHead("Models", "Models and access", "Every model OmniRoute offers, how much each is used, and which keys can use it. Check models sends one tiny request to each so you can see which ones really work.", `<button class="btn ghost" id="mCheck">${icon("refresh")}Check models</button><button class="btn ghost" id="mRefresh">${icon("refresh")}Reload list</button>`);
  if (!state.models || force) main.innerHTML = head + loading();
  try { await Promise.all([loadModels(force), loadKeys()]); } catch (e) { main.innerHTML = head + `<div class="callout red">${icon("warn")}${esc(e.message)}</div>`; return; }
  if (currentView() !== "models") return;
  const M = state.models;
  const groups = {};
  M.models.forEach((m) => { groups[m.group] = (groups[m.group] || 0) + 1; });
  main.innerHTML = head + `
    ${M.catalogError ? `<div class="callout red" style="margin-bottom:12px">${icon("warn")}${esc(M.catalogError)}</div>` : ""}
    <div class="toolbar reveal" style="--i:1">
      <label class="search">${icon("search")}<input id="mSearch" placeholder="Search models" value="${esc(state.modelSearch)}"></label>
      <div class="chips"><button class="chip ${state.modelGroup === "all" ? "on" : ""}" data-g="all">All<span class="n">${M.models.length}</span></button><button class="chip ${state.modelGroup === "used" ? "on" : ""}" data-g="used">Used<span class="n">${M.models.filter((m) => m.usageAll).length}</span></button>${Object.entries(groups).sort((a, b) => b[1] - a[1]).map(([g, n]) => `<button class="chip ${state.modelGroup === g ? "on" : ""}" data-g="${esc(g)}">${esc(g)}<span class="n">${n}</span></button>`).join("")}</div>
    </div>
    <div class="card reveal" style="--i:2"><div class="table-wrap"><table>
      <thead><tr><th>Model</th><th>Context</th><th>Abilities</th><th class="r">Tokens, 30 days</th><th class="r">Requests</th><th>Last used</th><th>Keys allowed</th></tr></thead>
      <tbody id="mBody"></tbody></table></div></div>`;
  $("#mRefresh").onclick = () => renderModels(true);
  $("#mCheck").onclick = startModelCheck;
  if (M.checkJob?.running) watchModelCheck();
  $("#mSearch").addEventListener("input", (e) => { state.modelSearch = e.target.value; fillModelRows(); });
  $$(".chip[data-g]").forEach((c) => c.addEventListener("click", () => { state.modelGroup = c.dataset.g; renderModels(); }));
  fillModelRows();
}

function keysAllowing(id) {
  const fam = state.models ? modelIndex(state.models.models).family(id) : [id];
  return (state.keys || []).filter((k) => !k.models || fam.some((x) => k.models.includes(x)));
}

// Check the models in the current filter (main names only; an alias shares its main model's result).
async function startModelCheck() {
  const M = state.models, q = state.modelSearch.trim().toLowerCase();
  const ids = M.models
    .filter((m) => !m.aliasOf && (state.modelGroup === "all" || (state.modelGroup === "used" ? !!m.usageAll : m.group === state.modelGroup)) && (!q || m.id.toLowerCase().includes(q)))
    .map((m) => m.id);
  if (!ids.length) return toast("No models to check in this view.", true);
  if (ids.length > 400) return toast(`That is ${ids.length} models. Pick a group or search first (400 at most).`, true);
  try {
    await api("/admin/api/models/check", { method: "POST", body: { ids } });
    toast(`Checking ${ids.length} model${ids.length === 1 ? "" : "s"}. This takes about ${Math.max(1, Math.round(ids.length / 3 * 2 / 60))} min.`);
    watchModelCheck();
  } catch (e) { toast(e.message, true); }
}
let checkTimer = null;
function watchModelCheck() {
  clearTimeout(checkTimer);
  const btn = $("#mCheck");
  const tick = async () => {
    let job = null;
    try { job = (await api("/admin/api/models/check")).job; } catch {}
    const b = $("#mCheck");
    if (job?.running) {
      if (b) { b.disabled = true; b.textContent = `Checking ${job.done} of ${job.total}`; }
      checkTimer = setTimeout(tick, 3000);
    } else {
      if (job?.error) toast(`Model check stopped: ${job.error}`, true);
      if (currentView() === "models") renderModels(true); else state.models = null;
    }
  };
  if (btn) btn.disabled = true;
  tick();
}

function fillModelRows() {
  const M = state.models, q = state.modelSearch.trim().toLowerCase();
  const keyCount = (state.keys || []).length;
  const rows = M.models
    .filter((m) => (state.modelGroup === "all" || (state.modelGroup === "used" ? !!m.usageAll : m.group === state.modelGroup)) && (!q || m.id.toLowerCase().includes(q)))
    .sort((a, b) => ((a.check?.status === "broken") - (b.check?.status === "broken")) || ((b.usage30d?.input || 0) + (b.usage30d?.output || 0)) - ((a.usage30d?.input || 0) + (a.usage30d?.output || 0)) || keysAllowing(b.id).filter((k) => k.models).length - keysAllowing(a.id).filter((k) => k.models).length);
  const body = $("#mBody");
  if (!rows.length) { body.innerHTML = `<tr><td colspan="7"><div class="empty"><span class="serif">No models found</span>Try another search or filter.</div></td></tr>`; return; }
  body.innerHTML = rows.map((m) => {
    const u = m.usage30d, allowed = keysAllowing(m.id), explicit = allowed.filter((k) => k.models).length, viaAll = allowed.length - explicit;
    const ab = [m.reasoning && "reasoning", m.tools && "tools", m.vision && "vision"].filter(Boolean).map((t) => `<span class="tag">${t}</span>`).join(" ");
    const usageCell = m.aliasOf ? `<span class="muted" style="font-size:12.5px">counted on ${esc(m.aliasOf)}</span>` : u ? `${short(u.input + u.output)}<div class="ksub">${short(u.input)} in · ${short(u.output)} out</div>` : `<span class="muted">0</span>`;
    return `<tr class="click" data-model="${esc(m.id)}">
      <td><div class="kname mono" style="font-size:13px">${esc(m.id)} ${checkTag(m.check)}</div><div class="ksub">${m.aliasOf ? "alias of " + esc(m.aliasOf) : esc(m.ownedBy || m.group)}</div></td>
      <td class="mono muted num">${m.contextLength ? short(m.contextLength) : "-"}</td>
      <td style="white-space:nowrap">${ab || `<span class="muted">-</span>`}</td>
      <td class="r num mono">${usageCell}</td>
      <td class="r num mono">${m.aliasOf ? `<span class="muted">-</span>` : u ? fmt.format(u.requests) : `<span class="muted">0</span>`}</td>
      <td class="muted">${m.aliasOf ? "-" : m.usageAll?.lastUsed ? relative(m.usageAll.lastUsed) : "Never"}</td>
      <td><span class="tag">${allowed.length} of ${keyCount}</span>${viaAll && explicit ? `<div class="ksub">${viaAll} via all-models</div>` : ""}</td></tr>`;
  }).join("");
  $$("tr[data-model]", body).forEach((tr) => tr.addEventListener("click", () => openModelAccess(tr.dataset.model)));
}

function openModelAccess(modelId) {
  const m = state.models.models.find((x) => x.id === modelId);
  const fam = modelIndex(state.models.models).family(modelId);
  const others = fam.filter((x) => x !== modelId);
  const keys = state.keys || [];
  openModal(`<div class="modal" role="dialog" aria-modal="true">
    <div class="modal-head"><div class="eyebrow">Model access</div><h2 class="serif" style="font-size:24px;font-family:var(--mono);letter-spacing:0">${esc(modelId)}</h2><p>Turn this model on or off for each key.${others.length ? ` Same model as <span class="mono">${esc(others.join(", "))}</span>; both names are allowed or removed together.` : ""}</p>${m?.check?.status === "broken" ? `<div class="callout red" style="margin-top:10px">${icon("warn")}<div>The provider rejects this model ID (${esc(m.check.message || "invalid model")}). Keys should not use it.</div></div>` : ""}</div>
    <div class="modal-body" style="gap:0">
      ${m?.usageAll ? `<div class="callout blue" style="margin-bottom:12px">${icon("cube")}<div>${short(m.usageAll.input + m.usageAll.output)} tokens used all time over ${fmt.format(m.usageAll.requests)} requests${m.aliasOf ? "" : " (including requests made under its other names)"}.</div></div>` : ""}
      ${keys.length ? keys.map((k) => {
        const all = !k.models, on = all || fam.some((x) => k.models.includes(x));
        return `<div class="list-row"><div class="grow"><div class="name">${esc(k.name)}</div><div class="ksub">${all ? "Allowed: this key can use all models" : `${k.models.length} model${k.models.length === 1 ? "" : "s"} allowed`}</div></div>${statusPill(k.status)}
          <label class="switch" title="${all ? "Change this key to 'Only selected' in its settings to restrict it" : ""}"><input type="checkbox" data-k="${k.id}" ${on ? "checked" : ""} ${all ? "disabled" : ""} aria-label="Allow for ${esc(k.name)}"><span></span></label></div>`;
      }).join("") : `<div class="muted">No keys yet.</div>`}
    </div>
    <div class="modal-foot"><button class="btn" data-close>Done</button></div></div>`);
  $$("[data-k]").forEach((c) => c.addEventListener("change", async () => {
    const k = keys.find((x) => x.id === c.dataset.k);
    const next = new Set(k.models || []);
    c.checked ? fam.forEach((x) => next.add(x)) : fam.forEach((x) => next.delete(x));
    if (!next.size) { c.checked = true; return toast(`"${k.name}" needs at least one model. Allow another model first, or set it to all models.`, true); }
    c.disabled = true;
    try {
      await api(`/admin/api/keys/${k.id}`, { method: "PATCH", body: { models: [...next] } });
      k.models = [...next];
      toast(`${c.checked ? "Allowed" : "Removed"} for "${k.name}".`);
      if (currentView() === "models") fillModelRows();
      $(".ksub", c.closest(".list-row")).textContent = `${next.size} model${next.size === 1 ? "" : "s"} allowed`;
    } catch (e) { c.checked = !c.checked; toast(e.message, true); }
    finally { c.disabled = false; }
  }));
}

// =============== PROVIDERS ===============
async function renderProviders(force) {
  const main = $("#main");
  const head = pageHead("Providers", "Provider balances", "Credits left on your provider accounts, and roughly how many tokens that buys.", `<button class="btn ghost" id="pRefresh">${icon("refresh")}Check now</button>`);
  main.innerHTML = head + loading();
  $("#pRefresh").onclick = () => renderProviders(true);
  let d;
  try { d = await api("/admin/api/providers" + (force ? "?refresh=1" : "")); } catch (e) { main.innerHTML = head + `<div class="callout red">${icon("warn")}${esc(e.message)}</div>`; $("#pRefresh").onclick = () => renderProviders(true); return; }
  if (currentView() !== "providers") return;
  applyProviderCount(d);
  const credits = (n) => (n == null ? "-" : Number(n).toLocaleString(undefined, { maximumFractionDigits: 2 }));
  const active = d.providers.filter((p) => p.isActive);
  const inactive = d.providers.filter((p) => !p.isActive);

  // Capacity: tokens promised to keys vs tokens the providers can still supply.
  let capacity = "";
  if (active.some((p) => p.estimate)) {
    const over = d.committed > d.tokensAvailable;
    capacity = `<div class="card card-pad reveal" style="--i:1;margin-bottom:12px">
      <div class="card-title"><h3>Can your providers cover your keys?</h3>${over || d.unlimitedKeys ? `<span class="pill ${over ? "red" : "yellow"}">${over ? "Not enough" : "Check"}</span>` : `<span class="pill green">Covered</span>`}</div>
      <div class="grid g-2" style="gap:24px">
        <div><div class="eyebrow">Tokens left on keys</div><div class="stat"><div class="v serif num">${splitShort(d.committed)[0]}<small>${splitShort(d.committed)[1]}</small></div></div><div class="muted" style="font-size:13px">What all active keys could still use, added up${d.unlimitedKeys ? `, plus <b style="color:var(--ink)">${d.unlimitedKeys}</b> key${d.unlimitedKeys === 1 ? "" : "s"} with no limit` : ""}.</div></div>
        <div><div class="eyebrow">Tokens the providers can supply</div><div class="stat"><div class="v serif num">≈ ${splitShort(d.tokensAvailable)[0]}<small>${splitShort(d.tokensAvailable)[1]}</small></div></div><div class="muted" style="font-size:13px">Estimated from the credits left and the credits your requests have used so far.</div></div>
      </div>
      ${over ? `<div class="callout red" style="margin-top:16px">${icon("warn")}<div>Your keys can use about <b>${short(d.committed - d.tokensAvailable)}</b> more tokens than your provider credits cover. If they all get used, requests will start failing before the keys run out.</div></div>` : ""}
      ${!over && d.unlimitedKeys ? `<div class="callout yellow" style="margin-top:16px">${icon("warn")}<div>Keys with no limit can use all of your provider credits.</div></div>` : ""}
    </div>`;
  }

  const card = (p, i) => {
    const c = p.credit, e = p.estimate;
    const pct = c && c.total ? Math.max(0, Math.min(100, (c.remaining / c.total) * 100)) : null;
    const tone = pct == null ? "" : pct <= 10 ? " over" : "";
    const [tv, tu] = e ? splitShort(e.tokensLeft) : ["", ""];
    const when = p.fetchedAt ? `${p.live ? "Checked" : "Last synced"} ${relative(p.fetchedAt)}` : "Not checked yet";
    return `<div class="card card-pad reveal" style="--i:${i + 2}">
      <div class="card-title" style="align-items:flex-start">
        <div style="min-width:0"><h3 style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(p.name)}</h3><div class="ksub">${esc(p.provider)}${p.plan ? " · " + esc(p.plan) : ""} · ${esc(when)}</div></div>
        ${p.isActive ? (p.testStatus && p.testStatus !== "active" ? `<span class="pill yellow">${esc(p.testStatus)}</span>` : `<span class="pill green">Active</span>`) : `<span class="pill gray">${esc(p.testStatus || "Off")}</span>`}
      </div>
      ${p.liveError ? `<div class="callout yellow" style="margin-bottom:12px">${icon("warn")}<div>Could not check live: ${esc(p.liveError)}. Showing the last synced numbers.</div></div>` : ""}
      ${c ? `
        <div class="grid g-2" style="gap:24px;align-items:end">
          <div><div class="eyebrow">Credits left</div><div class="balance-big serif num" style="margin-top:12px">${credits(c.remaining)}</div><div class="muted" style="margin-top:6px">of <b style="color:var(--ink)">${credits(c.total)}</b> · ${credits(c.used)} used${c.resetAt ? ` · resets ${dFmt.format(toDate(c.resetAt))} (${relative(c.resetAt)})` : ""}</div></div>
          <div style="text-align:right">${e ? `<div class="eyebrow">Estimated tokens left</div><div class="balance-big serif num" style="margin-top:12px">≈ ${tv}<small>${tu}</small></div><div class="muted" style="margin-top:6px">at about <b style="color:var(--ink)">${credits(e.rate.creditsPerMillion)}</b> credits per 1M tokens</div>` : `<div class="eyebrow">Estimated tokens left</div><div class="muted" style="margin-top:12px">Not enough usage yet to estimate.<br>Send a few requests through OmniRoute first.</div>`}</div>
        </div>
        ${pct != null ? `<div class="bigbar"><i class="${tone ? "over" : "in"}" style="width:${pct}%"></i></div><div class="legend" style="justify-content:space-between"><span>${pct.toFixed(0)}% of credits left</span>${e ? `<span>Rate measured over ${fmt.format(e.rate.requests)} request${e.rate.requests === 1 ? "" : "s"} (${short(e.rate.input)} in · ${short(e.rate.output)} out)</span>` : ""}</div>` : ""}
        ${e && e.creditsElsewhere != null && e.creditsElsewhere > Math.max(1, c.used * 0.05) ? `<div class="callout blue" style="margin-top:16px">${icon("warn")}<div><b>${credits(e.creditsElsewhere)}</b> of the ${credits(c.used)} credits used this period did not go through OmniRoute, for example from using this account directly in its own app. That use also takes from the same balance.</div></div>` : ""}
        ${e && e.rate.requests < 50 ? `<div class="hint" style="margin-top:12px">The estimate is based on few requests so far, so treat it as rough. Output tokens and long prompts cost more credits than short ones, so the real number depends on how the keys are used.</div>` : ""}
      ` : p.quotas.length ? `<div class="table-wrap"><table><thead><tr><th>Quota</th><th class="r">Left</th><th class="r">Total</th><th>Resets</th></tr></thead><tbody>${p.quotas.slice(0, 12).map((q) => `<tr><td class="mono" style="font-size:12.5px">${esc(q.name)}</td><td class="r num mono">${q.unlimited ? "Unlimited" : credits(q.remaining)}</td><td class="r num mono">${q.unlimited ? "-" : credits(q.total)}</td><td class="muted">${q.resetAt ? relative(q.resetAt) : "-"}</td></tr>`).join("")}</tbody></table></div>${p.quotas.length > 12 ? `<div class="hint">and ${p.quotas.length - 12} more</div>` : ""}`
        : `<div class="muted">This provider does not report a balance.</div>`}
    </div>`;
  };

  main.innerHTML = head + capacity +
    (active.length ? `<div class="grid" style="gap:12px">${active.map(card).join("")}</div>` : `<div class="card"><div class="empty"><span class="serif">No active providers</span>Connect one in the OmniRoute dashboard.</div></div>`) +
    (inactive.length ? `<div class="eyebrow" style="margin:28px 0 12px">Inactive connections</div><div class="grid" style="gap:12px">${inactive.map((p, i) => card(p, i + active.length)).join("")}</div>` : "");
  $("#pRefresh").onclick = () => renderProviders(true);
}

// =============== layer helpers ===============
function openModal(html) {
  const layer = $("#layer");
  const hadDrawer = !!$(".drawer", layer);
  const holder = document.createElement("div");
  holder.className = "modal-holder";
  holder.innerHTML = `<div class="scrim top" data-close></div>${html}`;
  if (!hadDrawer) layer.innerHTML = "";
  layer.append(holder);
  bindClose(holder, true);
}
function bindClose(root, modalOnly) {
  $$("[data-close]", root).forEach((el) => el.addEventListener("click", () => (modalOnly ? closeTopModal() : closeLayer())));
}
function closeTopModal() { const h = $$("#layer .modal-holder").pop(); if (h) h.remove(); else closeLayer(); }
function closeLayer() { $("#layer").innerHTML = ""; closeMenu(); }
document.addEventListener("keydown", (e) => { if (e.key === "Escape") { if ($("#menu")) return closeMenu(); if ($("#layer .modal-holder")) return closeTopModal(); closeLayer(); } });

// =============== boot ===============
(async () => {
  try {
    const s = await api("/admin/api/session");
    state.portalUrl = s.portalUrl || state.portalUrl;
    state.omniUrl = s.omniUrl || state.omniUrl;
    s.signedIn ? showApp() : showSignin();
  } catch { showSignin(); }
})();
})();
</script>
</body>
</html>
